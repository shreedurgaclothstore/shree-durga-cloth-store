name = "cloth-shop-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "cloth-shop-db"
database_id = "local-cloth-shop-db"

# Cloudflare R2 Bucket for Product Clearance Photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "cloth-shop-photos"

# Scheduled Cron for 24-hr token expiration (every 10 minutes)
[triggers]
crons = ["*/10 * * * *"]
